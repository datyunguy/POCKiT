<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save Your Savings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#F7F7F5;--card:#fff;--ink:#111;--mut:#6B6B6B;--line:#EAEAEA;--g:#21C46B;--gt:#0C7A3F;--gb:#E4F8EC;--wt:#8A5A00;--wb:#FFF3D1;--rt:#B3332F;--rb:#FCE7E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#0E0E0D;--card:#1A1A18;--ink:#F4F4F1;--mut:#A4A49D;--line:#2E2E2B;--gt:#4BE08F;--gb:#12301F;--wt:#F5C04A;--wb:#33280A;--rt:#FF8C86;--rb:#3A1614}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.app{display:flex}.side{display:none}
.main{flex:1;min-width:0;max-width:1000px;margin:auto;padding:20px 16px 160px}.main.in{animation:in .2s}.narrow{max-width:460px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}h2{font-size:18px;font-weight:700}
.mut{color:var(--mut)}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.gap>*+*{margin-top:14px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;font-weight:700;transition:transform .1s}.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--ink)}.btn.g{background:var(--g);border-color:var(--g);color:#06210F}.btn.full{width:100%;margin-top:10px}.btn:disabled{opacity:.4;cursor:not-allowed}
.lnk{background:none;border:0;font-weight:700;padding:6px 0;text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 2px #0000000a,0 8px 24px #0000000a;margin-top:14px}
.hero{background:#111;color:#fff;border-radius:24px;padding:22px;margin-top:16px;border:1px solid #333}.hero .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0 2px}.hero .gl{color:#4BE08F;font-weight:600}.hero small{color:#bbb;font-weight:600;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}.stat span{font-size:13px;color:var(--mut)}
.risk{border-color:var(--g)}.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--wb);color:var(--wt);font-size:14px}.note button{background:none;border:0;font-weight:700;text-decoration:underline;color:inherit}
.grid{display:grid;gap:0 14px}
.v.dim{opacity:.6}.vt{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left}
.logo{width:46px;height:46px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.bn{display:block;font-size:14px;font-weight:600;color:var(--mut)}.amt{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.st{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}.st.active{background:var(--gb);color:var(--gt)}.st.soon{background:var(--wb);color:var(--wt)}.st.exp{background:var(--rb);color:var(--rt)}.st.used,.st.exch{background:var(--line);color:var(--mut)}
.wt{color:var(--wt);font-weight:600}.code{font-family:ui-monospace,Menlo,monospace;border:1.5px dashed var(--line);border-radius:10px;padding:5px 10px;font-weight:600;letter-spacing:.05em}
.vb{position:relative;border-top:1px dashed var(--line);margin:14px -18px 0;padding:14px 18px 0;display:flex;gap:8px}.vb .btn{flex:1;padding:10px}
.vb:before,.vb:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}.vb:before{left:-10px;clip-path:inset(0 0 0 50%)}.vb:after{right:-10px;clip-path:inset(0 50% 0 0)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f{margin-top:14px}label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}input[type=checkbox]{width:20px;height:20px;padding:0}
.err{color:var(--rt);font-size:14px;min-height:21px;margin-top:8px}.hint{font-size:13px;color:var(--mut);margin-top:4px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .6s}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}.li:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:600}
.tick{width:72px;height:72px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:36px;color:#06210F;margin:10vh auto 18px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.bnav button,.side .nb{background:none;border:0;font-weight:600;color:var(--mut)}.bnav button{flex:1;padding:10px 0 12px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}.bnav .i{font-size:20px}
[aria-current=page]{color:var(--ink)!important}.bnav [aria-current=page]{box-shadow:inset 0 3px 0 var(--g)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--g);color:#06210F;border:0;border-radius:99px;padding:14px 20px;font-weight:800;box-shadow:0 8px 24px #0004}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 16px;border-radius:99px;display:none;gap:14px;align-items:center;z-index:20;font-weight:700;border:1px solid #333}#toast b{color:#4BE08F}#toast button{background:none;border:0;color:#4BE08F;font-weight:800}
.splash{position:fixed;inset:0;background:#111;color:#fff;display:grid;place-items:center;text-align:center;padding:24px}.splash h1{font-size:34px;letter-spacing:.04em}.splash p{color:#bbb;margin-top:10px}.splash i{display:block;height:4px;background:var(--g);border-radius:9px;margin:22px auto 0;width:0;animation:ld 1.5s ease-out forwards}@keyframes ld{to{width:140px}}
.dots{display:flex;gap:6px;margin:22px 0}.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}.dots i.on{width:26px;background:var(--g)}
@media (min-width:900px){.side{display:flex;flex-direction:column;gap:6px;width:250px;padding:24px 16px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}.side .nb{text-align:left;padding:12px 14px;border-radius:14px}.side [aria-current=page]{background:var(--card);box-shadow:0 0 0 1px var(--line)}.bnav,.fab{display:none}.main{padding-bottom:60px}.grid{grid-template-columns:1fr 1fr}.splash h1{font-size:46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.splash i{width:140px}}
</style></head>
<body><div id="root"></div><div id="toast" role="status"><b>✓</b><span id="tm"></span><button id="tu">Undo</button></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const CATS=["Shopping","Food","Travel","Entertainment","Fashion","Beauty","Electronics","Other"];
const BR={Amazon:["amazon.in","Shopping"],Myntra:["myntra.com","Fashion"],Swiggy:["swiggy.com","Food"],Zomato:["zomato.com","Food"],BookMyShow:["in.bookmyshow.com","Entertainment"],MakeMyTrip:["makemytrip.com","Travel"],Flipkart:["flipkart.com","Electronics"]};
const RW=[{n:"₹100 Amazon Voucher",c:2500},{n:"₹150 Myntra Voucher",c:3500},{n:"₹200 Swiggy Voucher",c:4000}];
const LBL={active:"Active",soon:"Expiring soon",exp:"Expired",used:"Used",exch:"Exchanged"};
const rs=n=>"₹"+Math.round(n).toLocaleString("en-IN"),sum=l=>l.reduce((s,c)=>s+(c.a||0),0);
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d},dt=i=>new Date(i+"T00:00:00");
const iso=n=>{const d=new Date(day0().getTime()+n*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=i=>dt(i).toLocaleDateString("en-IN",{day:"numeric",month:"short"}),fmtY=i=>dt(i).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});
const dl=c=>c.exp?Math.round((dt(c.exp)-day0())/864e5):null;
function st(c){if(c.s)return c.s;const d=dl(c);return d!==null&&d<0?"exp":d!==null&&d<=7?"soon":"active"}
const live=c=>["active","soon"].includes(st(c)),canEx=c=>c.ex&&c.a>0&&live(c),exv=c=>Math.round(c.a/2);
function when(c){const d=dl(c);return d==0?"today":d==1?"tomorrow":"in "+d+" days"}
function expTxt(c){const s=st(c);if(s=="used")return"Used "+fmt(c.at);if(s=="exch")return"Exchanged "+fmt(c.at);if(s=="exp")return"Expired "+fmt(c.exp);const d=dl(c);return d===null?"No expiry":d==0?"Expires today":d==1?"Expires tomorrow":d<=7?d+" days left":"Expires "+fmt(c.exp)}
const seed=()=>[["Myntra","DEMO-MYN500","₹500 OFF",500,1,"Fashion",1999,"Valid on selected products.",1],["Swiggy","DEMO-SWG150","₹150 OFF",150,3,"Food",399,"Valid once per user.",1],["Amazon","DEMO-AMZ400","₹400 OFF",400,5,"Shopping",1499,"Select categories only.",0],["Zomato","DEMO-ZMT100","₹100 OFF",100,0,"Food",299,"",0],["BookMyShow","DEMO-BMS250","₹250 OFF",250,9,"Entertainment",500,"Movies only.",1],["MakeMyTrip","DEMO-MMT800","₹800 OFF",800,14,"Travel",4000,"Domestic flights.",1],["Flipkart","DEMO-FLK1000","₹1,000 OFF",1000,21,"Electronics",9999,"",0],["Amazon","DEMO-AMZ15P","15% OFF",0,30,"Shopping",0,"",0],["Swiggy","DEMO-SWG75","₹75 OFF",75,40,"Food",199,"",0],["Myntra","DEMO-MYN200","₹200 OFF",200,10,"Fashion",999,"",0,"used",-6],["Zomato","DEMO-ZMT60","₹60 OFF",60,-4,"Food",199,"",0],["BookMyShow","DEMO-BMS150","₹150 OFF",150,6,"Entertainment",300,"",1,"exch",-9],["Flipkart","DEMO-FLK300","₹300 OFF",300,8,"Electronics",1999,"",0,"used",-12]].map((r,i)=>({id:"d"+i,b:r[0],code:r[1],url:"https://"+BR[r[0]][0],v:r[2],a:r[3],exp:iso(r[4]),cat:r[5],min:r[6],t:r[7],ex:r[8],s:r[9]||"",at:r[9]?iso(r[10]):"",cr:Date.now()-i*18e5,demo:1}));
let DB;try{DB=JSON.parse(localStorage.getItem("sys1"))}catch(e){}DB=DB||{users:[],sess:null,seen:false,data:{}};
const save=()=>{try{localStorage.setItem("sys1",JSON.stringify(DB))}catch(e){}},U=()=>DB.users.find(u=>u.id==DB.sess),D=()=>DB.data[DB.sess];
async function hs(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sys|"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(p)}}
const mkData=()=>({c:seed(),coins:2450,tx:[{t:"EARN",a:2375,d:"Welcome SaveCoins (demo)",ts:iso(-30)},{t:"EXCHANGE",a:75,d:"Exchanged BookMyShow saving",ts:iso(-9)}]});
let R={n:"splash"},hist=[],anim=0,W={f:"all",cat:"all",q:""},A={m:"in",e:""},O=0,tt,undo=null;
const go=(n,p={},rep)=>{if(!rep)hist.push(R);R={n,...p};anim=1;render();scrollTo(0,0)},back=()=>{R=hist.pop()||{n:"home"};anim=1;render();scrollTo(0,0)};
function toast(m,fn){$("#tm").textContent=m;$("#tu").style.display=fn?"":"none";undo=fn;$("#toast").style.display="flex";clearTimeout(tt);tt=setTimeout(()=>$("#toast").style.display="none",5000)}
$("#tu").onclick=()=>{undo&&undo();$("#toast").style.display="none"};
const snap=()=>{const s=JSON.stringify(D()),id=DB.sess;return()=>{DB.data[id]=JSON.parse(s);save();render()}};
const hdr=(t,sub)=>`<div class="row" style="margin-bottom:6px"><button class="lnk" data-a="back" aria-label="Back" style="text-decoration:none;font-size:22px">←</button><h1>${t}</h1></div>${sub?`<p class="mut">${sub}</p>`:""}`;
function card(c){const s=st(c),dead=!live(c);return `<article class="card v ${dead?"dim":""}"><button class="vt" data-a="open" data-id="${c.id}" aria-label="Open ${esc(c.b||c.code)}"><span class="logo">${esc((c.b||"•")[0].toUpperCase())}</span><span style="flex:1"><span class="bn">${esc(c.b||"Saved coupon")}</span><span class="amt">${esc(c.v||"Saved")}</span></span><span class="st ${s}">${LBL[s]}</span></button><div class="row sp" style="margin-top:10px"><span class="code">${esc(c.code)}</span><span class="${s=="soon"?"wt":"mut"}">${expTxt(c)}</span></div><div class="vb"><button class="btn o" data-a="copy" data-id="${c.id}">COPY CODE</button><button class="btn" data-a="use" data-id="${c.id}" ${!c.url||dead?"disabled":""}>USE NOW</button></div></article>`}
const empty=(t,b)=>`<div class="card" style="text-align:center"><p class="mut">${t}</p>${b||""}</div>`;
function listHTML(){const cs=D().c.filter(c=>st(c)!="exch"&&(W.f=="all"||st(c)==W.f)&&(W.cat=="all"||c.cat==W.cat)&&(!W.q||(c.b+c.code+c.cat).toLowerCase().includes(W.q.toLowerCase())));
cs.sort((a,b)=>(live(a)?0:1e6)+(dl(a)??9999)-((live(b)?0:1e6)+(dl(b)??9999)));return cs.length?cs.map(card).join(""):empty("No savings match this view. Change the filter, or save a new coupon.",'<button class="btn g full" data-a="add">SAVE A COUPON</button>')}
const S={
splash:()=>`<div class="splash"><div><h1>SAVE YOUR SAVINGS</h1><p>Keep every discount worth keeping.</p><i></i></div></div>`,
onb:()=>{const s=[["Save every saving.","Keep all your coupons, promo codes and vouchers in one place."],["Never lose a discount.","Get reminded before your savings expire."],["Make unused savings useful.","Eligible savings can eventually be exchanged for SaveCoins and rewards."]][O];return `<main class="main narrow in" style="padding-top:12vh"><p class="mut" style="font-weight:700;letter-spacing:.08em">SAVE YOUR SAVINGS</p><h1 style="font-size:40px;margin-top:24px">${s[0]}</h1><p class="mut" style="margin-top:12px;font-size:18px">${s[1]}</p><div class="dots">${[0,1,2].map(i=>`<i class="${i==O?"on":""}"></i>`).join("")}</div><button class="btn g full" data-a="onext">${O==2?"GET STARTED":"NEXT"}</button><button class="lnk" data-a="oskip" style="margin-top:10px">Skip</button></main>`},
auth:()=>{const i=A.m=="in";return `<main class="main narrow in" style="padding-top:8vh"><p class="mut" style="font-weight:700;letter-spacing:.08em">SAVE YOUR SAVINGS</p><h1 style="margin-top:18px">${i?"Welcome back.":"Create your wallet."}</h1><p class="mut">Your savings. One wallet.</p>${i?"":'<div class="f"><label for="an">Name</label><input id="an" autocomplete="name"></div>'}<div class="f"><label for="ae">Email</label><input id="ae" type="email" inputmode="email" autocomplete="email"></div><div class="f"><label for="ap">Password</label><input id="ap" type="password" autocomplete="${i?"current-password":"new-password"}" data-enter="#sub"></div><p class="err" id="aerr" role="alert">${esc(A.e)}</p><button class="btn full" id="sub" data-a="${i?"login":"signup"}">${i?"LOGIN":"CREATE ACCOUNT"}</button><button class="btn o full" data-a="amode">${i?"CREATE ACCOUNT":"I ALREADY HAVE AN ACCOUNT"}</button><div class="row sp" style="margin-top:12px"><button class="lnk" data-a="forgot">Forgot password?</button><button class="lnk" data-a="demo">Try the demo account</button></div></main>`},
home:()=>{const cs=D().c,act=cs.filter(live),soon=cs.filter(c=>st(c)=="soon"),used=cs.filter(c=>st(c)=="used"),h=new Date().getHours();
return `<h1>${h<12?"Good morning":h<17?"Good afternoon":"Good evening"}, ${esc(U().name.split(" ")[0])}</h1><section class="hero"><small>YOUR SAVINGS</small><div class="big">${rs(sum(act))}</div><div class="gl">Potential savings</div></section><div class="stats"><div class="stat"><b>${act.length}</b><span>Savings saved</span></div><div class="stat"><b>${soon.length}</b><span>Expiring soon</span></div><div class="stat"><b>${rs(sum(soon))}</b><span>At risk</span></div></div>
${soon.length?`<section class="card risk"><h2>SAVE BEFORE YOU LOSE</h2><p class="mut" style="margin:4px 0 6px">You have ${rs(sum(soon))} in potential savings expiring soon.</p><button class="btn g full" data-a="exp">VIEW EXPIRING SAVINGS</button></section>`:`<section class="card"><h2>All protected</h2><p class="mut">Nothing expires in the next 7 days.</p></section>`}
<div class="row sp" style="margin-top:22px"><h2>Recently saved</h2><button class="lnk" data-a="tab" data-id="wallet">VIEW ALL</button></div><div class="grid">${[...cs].filter(c=>st(c)!="exch").sort((a,b)=>b.cr-a.cr).slice(0,4).map(card).join("")}</div>
<p class="mut" style="margin-top:16px">You've used ${used.length} savings worth ${rs(sum(used))} so far.</p>${cs.some(c=>c.demo)?`<div class="note">You're seeing demo savings. <button data-a="clr">Clear demo data</button></div>`:""}`},
wallet:()=>{const cs=D().c,cats=CATS.filter(k=>cs.some(c=>c.cat==k)),n=s=>cs.filter(c=>st(c)==s).length;
return `<h1>MY SAVINGS</h1><div class="stats"><div class="stat"><b>${n("active")}</b><span>Active</span></div><div class="stat"><b>${n("soon")}</b><span>Expiring</span></div><div class="stat"><b>${n("used")}</b><span>Used</span></div></div><div class="f"><input id="q" type="search" placeholder="Search your savings…" aria-label="Search your savings" value="${esc(W.q)}"></div>
<div class="chips" role="group" aria-label="Status">${[["all","All"],["active","Active"],["soon","Expiring soon"],["used","Used"],["exp","Expired"]].map(([k,t])=>`<button class="chip" data-a="f" data-id="${k}" aria-pressed="${W.f==k}">${t}</button>`).join("")}</div><div class="chips" role="group" aria-label="Category">${["all",...cats].map(k=>`<button class="chip" data-a="cat" data-id="${k}" aria-pressed="${W.cat==k}">${k=="all"?"All categories":k}</button>`).join("")}</div><div class="grid" id="lst">${listHTML()}</div><div class="row" style="margin-top:14px"><button class="btn o" data-a="hist">SAVINGS HISTORY</button></div>`},
add:()=>{const c=R.id?D().c.find(x=>x.id==R.id):{};return `${hdr(R.id?"EDIT YOUR SAVING":"SAVE YOUR SAVING")}<div class="f"><label for="fc">Coupon Code *</label><input id="fc" placeholder="Paste your coupon code" value="${esc(c.code)}" autocomplete="off"><p class="hint">Paste a whole email or SMS and we'll pick out the code, link and date.</p></div><div class="f"><label for="fb">Brand</label><input id="fb" placeholder="Amazon, Myntra, Swiggy…" value="${esc(c.b)}"></div><div class="f"><label for="fu">Where can you use it?</label><input id="fu" placeholder="Paste website/app link" inputmode="url" value="${esc(c.url)}"></div><div class="f"><label for="fv">Your saving</label><input id="fv" placeholder="₹500 OFF" value="${esc(c.v)}"><p class="hint">Include an amount like ₹500 so it counts toward your potential savings.</p></div><div class="f"><label for="fe">Expiry date</label><input id="fe" type="date" value="${esc(c.exp)}"></div><div class="f"><label for="fk">Category</label><select id="fk">${CATS.map(k=>`<option ${c.cat==k?"selected":""}>${k}</option>`).join("")}</select></div><div class="f"><label for="fm">Minimum purchase (₹)</label><input id="fm" type="number" min="0" value="${esc(c.min)}"></div><div class="f"><label for="ft">Terms &amp; Conditions</label><textarea id="ft" rows="3">${esc(c.t)}</textarea></div><div class="f row"><input id="fx" type="checkbox" ${c.ex?"checked":""}><label for="fx" style="margin:0">This coupon is transferable, so it can be exchanged for SaveCoins</label></div><p class="err" id="ferr" role="alert"></p><button class="btn g full" data-a="saveC">SAVE COUPON</button><button class="btn o full" data-a="back">Cancel</button>`},
done:()=>`<main class="narrow" style="margin:auto;text-align:center;padding:16px"><div class="tick">✓</div><h1>${esc(R.t)}</h1><p class="mut" style="margin:8px 0 22px">${esc(R.m)}</p><button class="btn g full" data-a="tab" data-id="wallet">VIEW MY SAVINGS</button><button class="btn o full" data-a="tab" data-id="home">GO HOME</button></main>`,
